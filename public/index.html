<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Mihomo Router Release Catalog</title>
    <style>
      :root {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color-scheme: light dark;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }

      main {
        width: min(42rem, 100%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
      }

      p {
        line-height: 1.6;
      }

      a {
        font-weight: 700;
      }

      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mihomo Router Release Catalog</h1>
      <p>
        Verified latest stable release metadata for Mihomo and MetaCubeXD on
        Linux x86_64.
      </p>
      <p>
        Machine-readable endpoint:
        <a href="/v1/catalog.json"><code>/v1/catalog.json</code></a>
      </p>
      <p>Release assets remain hosted by the official upstream GitHub repositories.</p>
    </main>
  </body>
</html>
